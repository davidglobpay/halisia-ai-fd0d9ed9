name: Temporary formatting repair

on:
  push:
    branches:
      - codex/prettier-repair-2026-10-04

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/prettier-repair-2026-10-04
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit mechanical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "Apply repository formatting"
            git push
          fi
