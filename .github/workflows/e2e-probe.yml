name: E2E probe (temporary)

permissions:
  contents: read

on:
  push:
    branches: ["claude/e2e-probe-*"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx vite build --mode production
        env:
          NITRO_PRESET: node-server
          E2E_READABLE_SERVER_FN_IDS: "1"
      - name: Server function ids in the client bundle
        run: grep -rhoE '"[A-Za-z0-9_-]{24,}"' .output/public/assets | sort -u | head -60 | while read s; do v=$(echo "$s" | tr -d '"'); printf '%s => ' "$v"; echo "$v" | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 160; echo; done | grep -- "--" | head -40 || true
      - run: bunx playwright test --config=tests/e2e-probe/playwright.probe.config.ts
        env:
          CI: "1"
