name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Validate the latest revision of each PR/branch; superseded runs cannot
# satisfy release gates and should not keep consuming runner capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Formatting drift (prettier --check)
        run: bun run format:check
      - name: Lint (eslint, max-warnings=0)
        run: bunx eslint . --max-warnings=0
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests (vitest)
        run: bunx vitest run
      - name: Vite build (development)
        run: bunx vite build --mode development
      - name: Vite build (production)
        run: bunx vite build --mode production

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bunx playwright test --shard=${{ matrix.shard }}/6
        env:
          CI: "1"
      # Test failures remain fatal. Artifact storage is diagnostic only and
      # must not turn a storage-quota failure into an application finding.
      - name: Upload Playwright diagnostics (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 3
          if-no-files-found: ignore
