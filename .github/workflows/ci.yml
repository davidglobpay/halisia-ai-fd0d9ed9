name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Formatting drift (prettier --check)
        run: bun run format:check
      - name: Lint (eslint, max-warnings=0)
        run: bunx eslint . --max-warnings=0
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests (vitest)
        run: bunx vitest run
      - name: Vite build (development)
        run: bunx vite build --mode development
      - name: Vite build (production)
        run: bunx vite build --mode production

  e2e:
    name: Playwright E2E · shard ${{ matrix.index }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            shard: 1/4
          - index: 2
            shard: 2/4
          - index: 3
            shard: 3/4
          - index: 4
            shard: 4/4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bunx playwright test --shard=${{ matrix.shard }}
        env:
          CI: "1"
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.index }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload failure screenshots & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-media-shard-${{ matrix.index }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload county-logo snapshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: county-logo-snapshot-diffs-shard-${{ matrix.index }}
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            tests/e2e/**/__snapshots__/**
          retention-days: 14
          if-no-files-found: ignore
