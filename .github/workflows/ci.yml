name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, codex/reconciled-release-20261015]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Formatting drift (prettier --check)
        run: bun run format:check
      - name: Lint (eslint, max-warnings=0)
        run: bunx eslint . --max-warnings=0
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests (vitest)
        run: bunx vitest run
      - name: Vite build (development)
        run: bunx vite build --mode development
      - name: Vite build (production)
        run: bunx vite build --mode production

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build the production Node server for browser tests
        run: bunx vite build --mode production
        env:
          NITRO_PRESET: node-server
          E2E_READABLE_SERVER_FN_IDS: "1"
      - name: Run Playwright tests
        run: bunx playwright test --shard=${{ matrix.shard }}/6
        env:
          CI: "1"
          E2E_SERVER: prod
      - name: Upload 3D viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-3d-screenshots-${{ matrix.shard }}
          path: test-results/site-3d
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload failure screenshots & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-media-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload county-logo snapshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: county-logo-snapshot-diffs-${{ matrix.shard }}
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            tests/e2e/**/__snapshots__/**
          retention-days: 14
          if-no-files-found: ignore
