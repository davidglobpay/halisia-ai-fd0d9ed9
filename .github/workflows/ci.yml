name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Auto-fix formatting (prettier + eslint --fix)
        run: bun run fix
      - name: Formatting drift (prettier --check)
        run: bunx prettier --check .
      - name: Lint (eslint, max-warnings=0)
        run: bunx eslint . --max-warnings=0
      - name: Typecheck
        run: bun run typecheck
      - name: Vite build (development)
        run: bunx vite build --mode development
      - name: Vite build (production)
        run: bunx vite build --mode production

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bunx playwright test
        env:
          CI: "1"
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload county-logo snapshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: county-logo-snapshot-diffs
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            tests/e2e/**/__snapshots__/**
          retention-days: 14
          if-no-files-found: ignore
